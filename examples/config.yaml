listen: ":8080"
allow_local_network: true

plugins:
  dir: "./examples/plugins"
  chain:
    - name: auth
    - name: add-header
    - name: rate-limit
      config:
        key_header: "X-Forwarded-For"
        capacity: 5
        refill_rate: 1
    - name: caching
      config:
        max_size: "100"
        default_ttl: "60"

upstreams:
  - name: localhost:8081
    algorithm: round_robin
    circuit_breaker:
      enabled: true
      error_threshold: 2
      timeout: "2s"
    servers:
      - url: http://localhost:8081
